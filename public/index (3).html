<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Callback CRM</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#0f6e56"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .crm-root {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 480px;
    margin: 0 auto;
    color: #2c2c2a;
    background: #faf8f4;
    min-height: 100vh;
    padding-bottom: 2rem;
  }
  .crm-root h1, .crm-root h2, .crm-root h3 { font-weight: 500; margin: 0; }
  .crm-tabs { display: flex; border-bottom: 1px solid #e3ddd0; background: #faf8f4; position: sticky; top: 0; z-index: 5; }
  .crm-tab { flex: 1; padding: 14px 2px; text-align: center; font-size: 13px; font-weight: 500; color: #8a8578; border: none; background: none; border-bottom: 2px solid transparent; cursor: pointer; }
  .crm-tab.active { color: #0f6e56; border-bottom: 2px solid #0f6e56; }
  .crm-body { padding: 1rem; }
  .crm-empty { text-align: center; color: #8a8578; padding: 2.5rem 1rem; font-size: 14px; }
  .crm-card { background: #ffffff; border: 1px solid #e3ddd0; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .crm-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .crm-name { font-size: 15px; font-weight: 500; }
  .crm-sub { font-size: 13px; color: #8a8578; margin-top: 4px; }
  .crm-tag { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; margin-right: 6px; }
  .tag-realtor { background: #e6f1fb; color: #0c447c; }
  .tag-client { background: #eaf3de; color: #27500a; }
  .tag-other { background: #f1efe8; color: #444441; }
  .crm-method { font-size: 12px; color: #5f5e5a; }
  .crm-btn { border: 1px solid #cfc9ba; background: #ffffff; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: #2c2c2a; }
  .crm-btn:active { transform: scale(0.98); }
  .crm-btn-primary { background: #0f6e56; color: #ffffff; border-color: #0f6e56; }
  .crm-fab { width: 100%; padding: 12px; border-radius: 10px; background: #0f6e56; color: #fff; border: none; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 1rem; }
  .crm-field { margin-bottom: 12px; }
  .crm-field label { display: block; font-size: 12px; color: #5f5e5a; margin-bottom: 4px; font-weight: 500; }
  .crm-field input, .crm-field select { width: 100%; padding: 9px 10px; border: 1px solid #cfc9ba; border-radius: 8px; font-size: 14px; background: #ffffff; color: #2c2c2a; }
  .crm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .crm-modal { background: #faf8f4; width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; padding: 1.25rem; max-height: 85vh; overflow-y: auto; }
  .crm-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .crm-close { background: none; border: none; font-size: 20px; color: #8a8578; cursor: pointer; line-height: 1; padding: 4px; }
  .crm-actions { display: flex; gap: 8px; margin-top: 4px; }
  .crm-actions .crm-btn { flex: 1; }
  .crm-checkbox-row { display: flex; align-items: center; gap: 10px; }
  .crm-checkbox-row input { width: 18px; height: 18px; margin: 0; }
  .crm-section-title { font-size: 12px; font-weight: 500; color: #8a8578; text-transform: uppercase; letter-spacing: 0.03em; margin: 1.2rem 0 0.6rem; }
  .crm-loading { text-align: center; padding: 3rem; color: #8a8578; font-size: 14px; }
  .crm-taskrow { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .crm-taskrow input[type=text] { flex: 1; min-width: 120px; padding: 9px 10px; border: 1px solid #cfc9ba; border-radius: 8px; font-size: 14px; }
  .crm-taskrow input[type=date] { padding: 9px 6px; border: 1px solid #cfc9ba; border-radius: 8px; font-size: 13px; }
  .crm-filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .crm-banner { background: #eaf3de; color: #27500a; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .crm-banner button { white-space: nowrap; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
  .cal-dow { text-align: center; font-size: 11px; color: #8a8578; font-weight: 500; }
  .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid transparent; background: #ffffff; }
  .cal-day.empty { background: none; cursor: default; }
  .cal-day.selected { border-color: #0f6e56; background: #e1f5ee; }
  .cal-day.today { font-weight: 500; color: #0f6e56; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: #0f6e56; margin-top: 2px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="crm-root" id="crm-root">
  <div class="crm-loading">Loading your callbacks...</div>
</div>
<script>
(function() {
  const VAPID_PUBLIC_KEY = 'BJvjXcBcSk4j7vJ5YCWNQsnFM4PeFjhM0k2poOl8tOPH_p1b2V7dMJHicdDLPk0cwb9dwbRIuqh8_LTXBuHaXuI';
  const TAG_LABELS = { realtor: 'Realtor', client: 'Client', other: 'Other' };
  const METHOD_LABELS = { call: 'Call', text: 'Text', email: 'Email', linkedin: 'LinkedIn' };
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW = ['S','M','T','W','T','F','S'];

  let state = {
    contacts: [], tasks: [], history: [],
    tab: 'today', filterTag: 'all', modal: null,
    calYear: new Date().getFullYear(), calMonth: new Date().getMonth(),
    calSelected: null,
    notifStatus: 'unknown'
  };

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function formatDate(dateStr) {
    if (!dateStr) return '';
    const [y,m,d] = dateStr.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function dateKey(y,m,d) { return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
  function formatTime(t) {
    if (!t) return '';
    const [h, min] = t.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + String(min).padStart(2,'0') + ' ' + period;
  }

  async function loadAll() {
    try {
      const res = await fetch('/api/data');
      const data = await res.json();
      state.contacts = data.contacts || [];
      state.tasks = data.tasks || [];
      state.history = data.history || [];
    } catch (err) {
      state.contacts = []; state.tasks = []; state.history = [];
    }
  }
  async function saveAll() {
    try {
      await fetch('/api/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contacts: state.contacts, tasks: state.tasks, history: state.history })
      });
    } catch (err) { console.error('save failed', err); }
  }

  function badge(tag) { return '<span class="crm-tag tag-' + esc(tag) + '">' + esc(TAG_LABELS[tag] || tag) + '</span>'; }

  function isStandalone() {
    return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  }

  async function setupPush() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { state.notifStatus = 'unsupported'; return; }
    try {
      const reg = await navigator.serviceWorker.ready;
      const existing = await reg.pushManager.getSubscription();
      if (existing) { state.notifStatus = 'enabled'; return; }
      state.notifStatus = Notification.permission;
    } catch (err) { state.notifStatus = 'error'; }
  }

  async function enableNotifications() {
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { state.notifStatus = perm; render(); return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      await fetch('/api/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub) });
      state.notifStatus = 'enabled';
    } catch (err) {
      console.error(err);
      state.notifStatus = 'error';
    }
    render();
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  function render() {
    const root = document.getElementById('crm-root');
    const today = todayStr();
    const dueToday = state.contacts.filter(c => c.callbackDate && c.callbackDate <= today).sort((a,b) => (a.callbackTime||'99:99').localeCompare(b.callbackTime||'99:99'));
    const taskDueToday = state.tasks.filter(t => !t.done && (!t.date || t.date <= today)).sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
    const doneTasks = state.tasks.filter(t => t.done);
    const filteredContacts = state.filterTag === 'all' ? state.contacts : state.contacts.filter(c => c.tag === state.filterTag);
    const sortedContacts = filteredContacts.slice().sort((a,b) => (a.firstName+a.lastName).localeCompare(b.firstName+b.lastName));

    let html = '<div class="crm-tabs">';
    ['today','contacts','calendar','history'].forEach(t => {
      const label = t === 'today' ? 'Today' : t === 'contacts' ? 'Contacts' : t === 'calendar' ? 'Calendar' : 'History';
      html += '<button class="crm-tab' + (state.tab===t?' active':'') + '" data-tab="' + t + '">' + label + '</button>';
    });
    html += '</div><div class="crm-body">';

    if (!isStandalone()) {
      html += '<div class="crm-banner"><span>Add this to your homescreen for daily reminders.</span></div>';
    } else if (state.notifStatus !== 'enabled') {
      html += '<div class="crm-banner"><span>Turn on daily notifications for callbacks.</span><button class="crm-btn crm-btn-primary" id="enable-notif-btn">Enable</button></div>';
    }

    if (state.tab === 'today') {
      html += '<div class="crm-section-title">Callbacks</div>';
      if (dueToday.length === 0) html += '<div class="crm-empty">Nothing due today.</div>';
      dueToday.forEach(c => {
        html += '<div class="crm-card"><div class="crm-row"><div>' +
          '<div class="crm-name">' + esc(c.firstName) + ' ' + esc(c.lastName) + (c.callbackTime ? ' <span class="crm-method">' + esc(formatTime(c.callbackTime)) + '</span>' : '') + '</div>' +
          '<div class="crm-sub">' + badge(c.tag) + '<span class="crm-method">' + esc(METHOD_LABELS[c.method]) + ' &middot; ' + esc(c.phone) + '</span></div>' +
          '</div><button class="crm-btn crm-btn-primary" data-done="' + c.id + '">Done</button></div></div>';
      });
      html += '<div class="crm-section-title">To-dos</div>';
      html += '<div class="crm-taskrow"><input type="text" id="new-task-input" placeholder="Print flyers" value="' + esc(state.newTaskDraft || '') + '"/>' +
        '<input type="date" id="new-task-date" value="' + (state.newTaskDate || todayStr()) + '"/>' +
        '<input type="time" id="new-task-time" value="' + (state.newTaskTime || '') + '"/>' +
        '<button class="crm-btn" id="add-task-btn">Add</button></div>';
      taskDueToday.forEach(t => {
        html += '<div class="crm-card"><div class="crm-row">' +
          '<label class="crm-checkbox-row"><input type="checkbox" data-toggle-task="' + t.id + '"/><span>' + esc(t.text) + (t.time ? ' <span class="crm-method">' + esc(formatTime(t.time)) + '</span>' : '') + (t.date ? ' <span class="crm-method">(' + esc(formatDate(t.date)) + ')</span>' : '') + '</span></label>' +
          '<div style="display:flex;gap:6px"><button class="crm-btn" data-edit-task="' + t.id + '">Edit</button><button class="crm-close" data-delete-task="' + t.id + '">&times;</button></div></div></div>';
      });
      if (doneTasks.length > 0) {
        html += '<div class="crm-section-title">Done</div>';
        doneTasks.forEach(t => {
          html += '<div class="crm-card" style="opacity:0.55"><div class="crm-row">' +
            '<label class="crm-checkbox-row"><input type="checkbox" checked data-toggle-task="' + t.id + '"/><span style="text-decoration:line-through">' + esc(t.text) + '</span></label>' +
            '<div style="display:flex;gap:6px"><button class="crm-btn" data-edit-task="' + t.id + '">Edit</button><button class="crm-close" data-delete-task="' + t.id + '">&times;</button></div></div></div>';
        });
      }
    }

    if (state.tab === 'contacts') {
      html += '<button class="crm-fab" id="open-add-contact">+ Add contact</button>';
      html += '<div class="crm-filters">';
      ['all','realtor','client','other'].forEach(tg => {
        const active = state.filterTag === tg;
        html += '<button class="crm-btn" data-filter="' + tg + '" style="' + (active ? 'background:#0f6e56;color:#fff;border-color:#0f6e56' : '') + '">' + (tg === 'all' ? 'All' : TAG_LABELS[tg]) + '</button>';
      });
      html += '</div>';
      if (sortedContacts.length === 0) html += '<div class="crm-empty">No contacts yet. Add your first one above.</div>';
      sortedContacts.forEach(c => {
        html += '<div class="crm-card">' +
          '<div class="crm-name">' + esc(c.firstName) + ' ' + esc(c.lastName) + '</div>' +
          '<div class="crm-sub">' + badge(c.tag) + '<span class="crm-method">' + esc(METHOD_LABELS[c.method]) + ' &middot; ' + esc(c.phone) + '</span></div>' +
          '<div class="crm-sub">Next callback: ' + esc(formatDate(c.callbackDate)) + (c.callbackTime ? ' at ' + esc(formatTime(c.callbackTime)) : '') + '</div>' +
          '</div>';
      });
    }

    if (state.tab === 'calendar') {
      html += renderCalendar();
    }

    if (state.tab === 'history') {
      if (state.history.length === 0) html += '<div class="crm-empty">No completed callbacks yet.</div>';
      state.history.forEach(h => {
        html += '<div class="crm-card">' +
          '<div class="crm-name">' + esc(h.firstName) + ' ' + esc(h.lastName) + '</div>' +
          '<div class="crm-sub">' + badge(h.tag) + '<span class="crm-method">Contacted by ' + esc(METHOD_LABELS[h.method]) + '</span></div>' +
          '<div class="crm-sub">Completed ' + esc(formatDate(h.completedDate)) + ' &middot; next: ' + esc(formatDate(h.nextDate)) + '</div>' +
          '</div>';
      });
    }

    html += '</div>';
    if (state.modal === 'add-contact') html += renderContactModal();
    if (state.modal === 'done' && state.doneTarget) html += renderDoneModal(state.doneTarget);
    if (state.modal === 'edit-task' && state.editTaskTarget) html += renderEditTaskModal(state.editTaskTarget);

    root.innerHTML = html;
    attachHandlers();
  }

  function renderCalendar() {
    const y = state.calYear, m = state.calMonth;
    const first = new Date(y, m, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const today = todayStr();

    const dueByDate = {};
    state.contacts.forEach(c => { if (c.callbackDate) { (dueByDate[c.callbackDate] = dueByDate[c.callbackDate] || []).push({ type: 'contact', item: c }); } });
    state.tasks.forEach(t => { if (!t.done && t.date) { (dueByDate[t.date] = dueByDate[t.date] || []).push({ type: 'task', item: t }); } });

    let html = '<div class="cal-nav"><button class="crm-btn" data-cal-prev="1">&larr;</button><h3>' + MONTH_NAMES[m] + ' ' + y + '</h3><button class="crm-btn" data-cal-next="1">&rarr;</button></div>';
    html += '<div class="cal-grid">';
    DOW.forEach(d => html += '<div class="cal-dow">' + d + '</div>');
    for (let i = 0; i < startDow; i++) html += '<div class="cal-day empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(y, m, d);
      const has = dueByDate[key] && dueByDate[key].length > 0;
      let cls = 'cal-day';
      if (key === today) cls += ' today';
      if (key === state.calSelected) cls += ' selected';
      html += '<div class="' + cls + '" data-cal-day="' + key + '">' + d + (has ? '<div class="cal-dot"></div>' : '') + '</div>';
    }
    html += '</div>';

    if (state.calSelected) {
      const items = dueByDate[state.calSelected] || [];
      html += '<div class="crm-section-title">' + formatDate(state.calSelected) + '</div>';
      if (items.length === 0) html += '<div class="crm-empty">Nothing scheduled this day.</div>';
      items.forEach(entry => {
        if (entry.type === 'contact') {
          const c = entry.item;
          html += '<div class="crm-card"><div class="crm-name">' + esc(c.firstName) + ' ' + esc(c.lastName) + (c.callbackTime ? ' <span class="crm-method">' + esc(formatTime(c.callbackTime)) + '</span>' : '') + '</div>' +
            '<div class="crm-sub">' + badge(c.tag) + '<span class="crm-method">' + esc(METHOD_LABELS[c.method]) + ' &middot; ' + esc(c.phone) + '</span></div></div>';
        } else {
          const t = entry.item;
          html += '<div class="crm-card"><div class="crm-row"><div class="crm-name">' + esc(t.text) + (t.time ? ' <span class="crm-method">' + esc(formatTime(t.time)) + '</span>' : '') + '</div>' +
            '<div style="display:flex;gap:6px"><button class="crm-btn" data-edit-task="' + t.id + '">Edit</button><button class="crm-close" data-delete-task="' + t.id + '">&times;</button></div></div><div class="crm-sub">To-do</div></div>';
        }
      });
    }
    return html;
  }

  function renderContactModal() {
    const d = state.contactDraft || { tag: 'client', method: 'call', callbackDate: todayStr() };
    return '<div class="crm-overlay"><div class="crm-modal">' +
      '<div class="crm-modal-header"><h3>Add contact</h3><button class="crm-close" id="close-add-contact">&times;</button></div>' +
      field('First name', 'text', 'cf-first', esc(d.firstName || ''), 'Jamie') +
      field('Last name', 'text', 'cf-last', esc(d.lastName || ''), 'Rivera') +
      selectField('Tag', 'cf-tag', d.tag, [['realtor','Realtor'],['client','Client'],['other','Other']]) +
      field('Phone number', 'text', 'cf-phone', esc(d.phone || ''), '(555) 123-4567') +
      selectField('Contact by', 'cf-method', d.method, [['call','Call'],['text','Text'],['email','Email'],['linkedin','LinkedIn']]) +
      field('Callback date', 'date', 'cf-date', d.callbackDate, '') +
      field('Time (optional)', 'time', 'cf-time', d.callbackTime || '', '') +
      '<div class="crm-actions"><button class="crm-btn" id="cancel-add-contact">Cancel</button><button class="crm-btn crm-btn-primary" id="save-add-contact">Save contact</button></div>' +
      '</div></div>';
  }

  function renderDoneModal(c) {
    const d = state.doneDraft || { firstName: c.firstName, lastName: c.lastName, tag: c.tag, phone: c.phone, nextMethod: c.method, nextDate: '' };
    return '<div class="crm-overlay"><div class="crm-modal">' +
      '<div class="crm-modal-header"><h3>Confirm and set next callback</h3><button class="crm-close" id="close-done">&times;</button></div>' +
      field('First name', 'text', 'df-first', esc(d.firstName), '') +
      field('Last name', 'text', 'df-last', esc(d.lastName), '') +
      selectField('Tag', 'df-tag', d.tag, [['realtor','Realtor'],['client','Client'],['other','Other']]) +
      field('Phone number', 'text', 'df-phone', esc(d.phone), '') +
      '<div class="crm-section-title">Next callback</div>' +
      selectField('Contact by', 'df-method', d.nextMethod, [['call','Call'],['text','Text'],['email','Email'],['linkedin','LinkedIn']]) +
      field('Date to contact next', 'date', 'df-date', d.nextDate, '') +
      field('Time (optional)', 'time', 'df-time', d.nextTime || '', '') +
      '<div class="crm-actions"><button class="crm-btn" id="cancel-done">Cancel</button><button class="crm-btn crm-btn-primary" id="confirm-done">Mark done</button></div>' +
      '</div></div>';
  }

  function renderEditTaskModal(t) {
    const d = state.editTaskDraft || { text: t.text, date: t.date || todayStr(), time: t.time || '' };
    return '<div class="crm-overlay"><div class="crm-modal">' +
      '<div class="crm-modal-header"><h3>Edit to-do</h3><button class="crm-close" id="close-edit-task">&times;</button></div>' +
      field('Task', 'text', 'et-text', esc(d.text), '') +
      field('Date', 'date', 'et-date', d.date, '') +
      field('Time (optional)', 'time', 'et-time', d.time || '', '') +
      '<div class="crm-actions"><button class="crm-btn" id="delete-edit-task" style="color:#a32d2d">Delete</button><button class="crm-btn crm-btn-primary" id="save-edit-task">Save</button></div>' +
      '</div></div>';
  }

  function field(label, type, id, value, placeholder) {
    return '<div class="crm-field"><label>' + label + '</label><input type="' + type + '" id="' + id + '" value="' + (value || '') + '" placeholder="' + placeholder + '"/></div>';
  }
  function selectField(label, id, value, options) {
    let opts = options.map(([v,l]) => '<option value="' + v + '"' + (v===value?' selected':'') + '>' + l + '</option>').join('');
    return '<div class="crm-field"><label>' + label + '</label><select id="' + id + '">' + opts + '</select></div>';
  }

  function readContactDraft() {
    state.contactDraft = {
      firstName: document.getElementById('cf-first').value,
      lastName: document.getElementById('cf-last').value,
      tag: document.getElementById('cf-tag').value,
      phone: document.getElementById('cf-phone').value,
      method: document.getElementById('cf-method').value,
      callbackDate: document.getElementById('cf-date').value,
      callbackTime: document.getElementById('cf-time').value
    };
  }
  function readDoneDraft() {
    state.doneDraft = {
      firstName: document.getElementById('df-first').value,
      lastName: document.getElementById('df-last').value,
      tag: document.getElementById('df-tag').value,
      phone: document.getElementById('df-phone').value,
      nextMethod: document.getElementById('df-method').value,
      nextDate: document.getElementById('df-date').value,
      nextTime: document.getElementById('df-time').value
    };
  }

  function attachHandlers() {
    document.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => { state.tab = el.getAttribute('data-tab'); render(); });
    document.querySelectorAll('[data-filter]').forEach(el => el.onclick = () => { state.filterTag = el.getAttribute('data-filter'); render(); });

    const enableBtn = document.getElementById('enable-notif-btn');
    if (enableBtn) enableBtn.onclick = enableNotifications;

    const addBtn = document.getElementById('open-add-contact');
    if (addBtn) addBtn.onclick = () => { state.modal = 'add-contact'; state.contactDraft = null; render(); };
    const closeAdd = document.getElementById('close-add-contact');
    if (closeAdd) closeAdd.onclick = () => { state.modal = null; render(); };
    const cancelAdd = document.getElementById('cancel-add-contact');
    if (cancelAdd) cancelAdd.onclick = () => { state.modal = null; render(); };
    const saveAdd = document.getElementById('save-add-contact');
    if (saveAdd) saveAdd.onclick = async () => {
      readContactDraft();
      const d = state.contactDraft;
      if (!d.firstName.trim() || !d.phone.trim()) return;
      state.contacts.push({ id: uid(), firstName: d.firstName.trim(), lastName: d.lastName.trim(), tag: d.tag, phone: d.phone.trim(), method: d.method, callbackDate: d.callbackDate || todayStr(), callbackTime: d.callbackTime || '' });
      await saveAll();
      state.modal = null; state.contactDraft = null;
      render();
    };

    document.querySelectorAll('[data-done]').forEach(el => el.onclick = () => {
      const id = el.getAttribute('data-done');
      state.doneTarget = state.contacts.find(c => c.id === id);
      state.doneDraft = null;
      state.modal = 'done';
      render();
    });
    const closeDone = document.getElementById('close-done');
    if (closeDone) closeDone.onclick = () => { state.modal = null; render(); };
    const cancelDone = document.getElementById('cancel-done');
    if (cancelDone) cancelDone.onclick = () => { state.modal = null; render(); };
    const confirmDone = document.getElementById('confirm-done');
    if (confirmDone) confirmDone.onclick = async () => {
      readDoneDraft();
      const d = state.doneDraft;
      const c = state.doneTarget;
      if (!d.firstName.trim() || !d.phone.trim() || !d.nextDate) return;
      state.contacts = state.contacts.map(x => x.id === c.id
        ? { ...x, firstName: d.firstName.trim(), lastName: d.lastName.trim(), tag: d.tag, phone: d.phone.trim(), method: d.nextMethod, callbackDate: d.nextDate, callbackTime: d.nextTime || '' }
        : x
      );
      state.history.unshift({ id: uid(), contactId: c.id, firstName: d.firstName.trim(), lastName: d.lastName.trim(), tag: d.tag, phone: d.phone.trim(), method: c.method, completedDate: todayStr(), nextDate: d.nextDate });
      await saveAll();
      state.modal = null; state.doneTarget = null;
      render();
    };

    const taskInput = document.getElementById('new-task-input');
    if (taskInput) taskInput.oninput = () => { state.newTaskDraft = taskInput.value; };
    const taskDateInput = document.getElementById('new-task-date');
    if (taskDateInput) taskDateInput.oninput = () => { state.newTaskDate = taskDateInput.value; };
    const taskTimeInput = document.getElementById('new-task-time');
    if (taskTimeInput) taskTimeInput.oninput = () => { state.newTaskTime = taskTimeInput.value; };
    const addTaskBtn = document.getElementById('add-task-btn');
    if (addTaskBtn) addTaskBtn.onclick = async () => {
      const val = (state.newTaskDraft || '').trim();
      if (!val) return;
      state.tasks.push({ id: uid(), text: val, done: false, date: state.newTaskDate || todayStr(), time: state.newTaskTime || '' });
      state.newTaskDraft = '';
      await saveAll();
      render();
    };
    document.querySelectorAll('[data-toggle-task]').forEach(el => el.onclick = async () => {
      const id = el.getAttribute('data-toggle-task');
      state.tasks = state.tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      await saveAll();
      render();
    });
    document.querySelectorAll('[data-delete-task]').forEach(el => el.onclick = async () => {
      const id = el.getAttribute('data-delete-task');
      state.tasks = state.tasks.filter(t => t.id !== id);
      await saveAll();
      render();
    });

    document.querySelectorAll('[data-edit-task]').forEach(el => el.onclick = () => {
      const id = el.getAttribute('data-edit-task');
      state.editTaskTarget = state.tasks.find(t => t.id === id);
      state.editTaskDraft = null;
      state.modal = 'edit-task';
      render();
    });
    const closeEditTask = document.getElementById('close-edit-task');
    if (closeEditTask) closeEditTask.onclick = () => { state.modal = null; state.editTaskTarget = null; render(); };
    const saveEditTask = document.getElementById('save-edit-task');
    if (saveEditTask) saveEditTask.onclick = async () => {
      const text = document.getElementById('et-text').value.trim();
      const date = document.getElementById('et-date').value;
      const time = document.getElementById('et-time').value;
      if (!text || !date) return;
      const id = state.editTaskTarget.id;
      state.tasks = state.tasks.map(t => t.id === id ? { ...t, text, date, time } : t);
      await saveAll();
      state.modal = null; state.editTaskTarget = null;
      render();
    };
    const deleteEditTask = document.getElementById('delete-edit-task');
    if (deleteEditTask) deleteEditTask.onclick = async () => {
      const id = state.editTaskTarget.id;
      state.tasks = state.tasks.filter(t => t.id !== id);
      await saveAll();
      state.modal = null; state.editTaskTarget = null;
      render();
    };

    const prevBtn = document.querySelector('[data-cal-prev]');
    if (prevBtn) prevBtn.onclick = () => {
      state.calMonth -= 1;
      if (state.calMonth < 0) { state.calMonth = 11; state.calYear -= 1; }
      render();
    };
    const nextBtn = document.querySelector('[data-cal-next]');
    if (nextBtn) nextBtn.onclick = () => {
      state.calMonth += 1;
      if (state.calMonth > 11) { state.calMonth = 0; state.calYear += 1; }
      render();
    };
    document.querySelectorAll('[data-cal-day]').forEach(el => el.onclick = () => {
      const key = el.getAttribute('data-cal-day');
      state.calSelected = state.calSelected === key ? null : key;
      render();
    });
  }

  async function init() {
    if ('serviceWorker' in navigator) {
      try { await navigator.serviceWorker.register('/service-worker.js'); } catch (e) { console.error(e); }
    }
    await loadAll();
    await setupPush();
    render();
  }

  init();
})();
</script>
</body>
</html>
