<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>SimplePlan</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#1a5fb4"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .crm-root {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 480px;
    margin: 0 auto;
    color: #2c2c2a;
    background: #faf8f4;
    min-height: 100vh;
    padding-bottom: 2rem;
  }
  .crm-root h1, .crm-root h2, .crm-root h3 { font-weight: 500; margin: 0; }
  .crm-tabs { display: flex; border-bottom: 1px solid #e3ddd0; background: #faf8f4; position: sticky; top: 0; z-index: 5; }
  .crm-tab { flex: 1; padding: 14px 2px; text-align: center; font-size: 13px; font-weight: 500; color: #8a8578; border: none; background: none; border-bottom: 2px solid transparent; cursor: pointer; }
  .crm-tab.active { color: #1a5fb4; border-bottom: 2px solid #1a5fb4; }
  .crm-body { padding: 1rem; }
  .crm-empty { text-align: center; color: #8a8578; padding: 2.5rem 1rem; font-size: 14px; }
  .crm-card { background: #ffffff; border: 1px solid #e3ddd0; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .crm-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .crm-name { font-size: 15px; font-weight: 500; }
  .crm-sub { font-size: 13px; color: #8a8578; margin-top: 4px; }
  .crm-tag { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; margin-right: 6px; }
  .tag-realtor { background: #e6f1fb; color: #0c447c; }
  .tag-client { background: #eaf3de; color: #27500a; }
  .tag-other { background: #f1efe8; color: #444441; }
  .status-lead { background: #f1efe8; color: #444441; }
  .status-preapproval { background: #fef3d6; color: #7a5b06; }
  .status-disclosures { background: #e6f1fb; color: #0c447c; }
  .status-uw { background: #f1e6fb; color: #5b0c7c; }
  .status-ctc { background: #eaf3de; color: #27500a; }
  .drag-handle { cursor: grab; touch-action: none; padding: 2px 10px 2px 0; color: #b7b1a0; font-size: 18px; user-select: none; line-height: 1.4; }
  .crm-card.dragging { opacity: 0.6; box-shadow: 0 6px 16px rgba(0,0,0,0.2); position: relative; z-index: 20; }
  .crm-method { font-size: 12px; color: #5f5e5a; }
  .crm-btn { border: 1px solid #cfc9ba; background: #ffffff; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: #2c2c2a; }
  .crm-btn:active { transform: scale(0.98); }
  .crm-btn-primary { background: #1a5fb4; color: #ffffff; border-color: #1a5fb4; }
  .crm-fab { width: 100%; padding: 12px; border-radius: 10px; background: #1a5fb4; color: #fff; border: none; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 1rem; }
  .crm-field { margin-bottom: 12px; }
  .crm-field label { display: block; font-size: 12px; color: #5f5e5a; margin-bottom: 4px; font-weight: 500; }
  .crm-field input, .crm-field select, .crm-field textarea { width: 100%; padding: 9px 10px; border: 1px solid #cfc9ba; border-radius: 8px; font-size: 14px; background: #ffffff; color: #2c2c2a; font-family: inherit; resize: vertical; }
  .crm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .crm-modal { background: #faf8f4; width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; padding: 1.25rem; max-height: 85vh; overflow-y: auto; }
  .crm-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .crm-close { background: none; border: none; font-size: 20px; color: #8a8578; cursor: pointer; line-height: 1; padding: 4px; }
  .crm-actions { display: flex; gap: 8px; margin-top: 4px; }
  .crm-actions .crm-btn { flex: 1; }
  .crm-checkbox-row { display: flex; align-items: center; gap: 10px; }
  .crm-checkbox-row input { width: 18px; height: 18px; margin: 0; }
  .crm-section-title { font-size: 12px; font-weight: 500; color: #8a8578; text-transform: uppercase; letter-spacing: 0.03em; margin: 1.2rem 0 0.6rem; }
  .crm-loading { text-align: center; padding: 3rem; color: #8a8578; font-size: 14px; }
  .crm-taskrow { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .crm-taskrow input[type=text] { flex: 1; min-width: 120px; padding: 9px 10px; border: 1px solid #cfc9ba; border-radius: 8px; font-size: 14px; }
  .crm-taskrow input[type=date] { padding: 9px 6px; border: 1px solid #cfc9ba; border-radius: 8px; font-size: 13px; }
  .crm-filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .crm-banner { background: #eaf3de; color: #27500a; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .crm-banner button { white-space: nowrap; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
  .cal-dow { text-align: center; font-size: 11px; color: #8a8578; font-weight: 500; }
  .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid transparent; background: #ffffff; }
  .cal-day.empty { background: none; cursor: default; }
  .cal-day.selected { border-color: #1a5fb4; background: #e3edfa; }
  .cal-day.today { font-weight: 500; color: #1a5fb4; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: #1a5fb4; margin-top: 2px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="crm-root" id="crm-root">
  <div class="crm-loading">Loading your callbacks...</div>
</div>
<script>
(function() {
  const VAPID_PUBLIC_KEY = 'BJvjXcBcSk4j7vJ5YCWNQsnFM4PeFjhM0k2poOl8tOPH_p1b2V7dMJHicdDLPk0cwb9dwbRIuqh8_LTXBuHaXuI';
  const TAG_LABELS = { realtor: 'Realtor', client: 'Client', other: 'Other' };
  const METHOD_LABELS = { call: 'Call', text: 'Text', whatsapp: 'WhatsApp', email: 'Email', linkedin: 'LinkedIn' };
  const METHOD_OPTIONS = Object.keys(METHOD_LABELS).map(k => [k, METHOD_LABELS[k]]);
  const STATUS_LABELS = { lead: 'Lead', preapproval: 'Preapproval', disclosures: 'Disclosures', uw: 'UW', ctc: 'CTC' };
  const STATUS_OPTIONS = Object.keys(STATUS_LABELS).map(k => [k, STATUS_LABELS[k]]);
  const LOAN_TYPE_LABELS = { purchase: 'Purchase', rt_refi: 'R/T Refi', co_refi: 'C/O Refi', other: 'Other' };
  const LOAN_TYPE_OPTIONS = Object.keys(LOAN_TYPE_LABELS).map(k => [k, LOAN_TYPE_LABELS[k]]);
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW = ['S','M','T','W','T','F','S'];

  let state = {
    contacts: [], tasks: [], history: [], pipeline: [], links: [],
    tab: 'today', filterTag: 'all', modal: null,
    calYear: new Date().getFullYear(), calMonth: new Date().getMonth(),
    calSelected: null,
    notifStatus: 'unknown',
    contactSearch: ''
  };

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function formatDate(dateStr) {
    if (!dateStr) return '';
    const [y,m,d] = dateStr.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function dateKey(y,m,d) { return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
  function formatTime(t) {
    if (!t) return '';
    const [h, min] = t.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + String(min).padStart(2,'0') + ' ' + period;
  }
  function formatPhoneDisplay(phone) {
    const digits = String(phone == null ? '' : phone).replace(/\D/g, '').slice(0, 10);
    if (digits.length > 6) return digits.slice(0,3) + '-' + digits.slice(3,6) + '-' + digits.slice(6);
    if (digits.length > 3) return digits.slice(0,3) + '-' + digits.slice(3);
    return digits;
  }

  async function loadAll() {
    try {
      const res = await fetch('/api/data');
      const data = await res.json();
      state.contacts = data.contacts || [];
      state.tasks = data.tasks || [];
      state.history = data.history || [];
      state.pipeline = data.pipeline || [];
      state.links = data.links || [];
    } catch (err) {
      state.contacts = []; state.tasks = []; state.history = []; state.pipeline = []; state.links = [];
    }
  }
  async function saveAll() {
    try {
      await fetch('/api/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contacts: state.contacts, tasks: state.tasks, history: state.history, pipeline: state.pipeline, links: state.links })
      });
    } catch (err) { console.error('save failed', err); }
  }

  function badge(tag) { return '<span class="crm-tag tag-' + esc(tag) + '">' + esc(TAG_LABELS[tag] || tag) + '</span>'; }
  function statusBadge(status) { return '<span class="crm-tag status-' + esc(status) + '">' + esc(STATUS_LABELS[status] || status) + '</span>'; }
  function loanTypeLabel(p) {
    if (!p.loanType) return '';
    if (p.loanType === 'other') return p.loanTypeOther ? ('Other - ' + p.loanTypeOther) : 'Other';
    return LOAN_TYPE_LABELS[p.loanType] || '';
  }

  function isStandalone() {
    return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  }

  async function setupPush() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { state.notifStatus = 'unsupported'; return; }
    try {
      const reg = await navigator.serviceWorker.ready;
      const existing = await reg.pushManager.getSubscription();
      if (existing) { state.notifStatus = 'enabled'; return; }
      state.notifStatus = Notification.permission;
    } catch (err) { state.notifStatus = 'error'; }
  }

  async function enableNotifications() {
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { state.notifStatus = perm; render(); return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      await fetch('/api/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub) });
      state.notifStatus = 'enabled';
    } catch (err) {
      console.error(err);
      state.notifStatus = 'error';
    }
    render();
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  function render() {
    const active = document.activeElement;
    const activeId = active && active.id;
    const activeSelStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    const root = document.getElementById('crm-root');
    const today = todayStr();
    const dueToday = state.contacts.filter(c => c.callbackDate && c.callbackDate <= today).sort((a,b) => (a.callbackTime||'99:99').localeCompare(b.callbackTime||'99:99'));
    const taskDueToday = state.tasks.filter(t => !t.done && (!t.date || t.date <= today)).sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
    const doneTasks = state.tasks.filter(t => t.done);
    const tagFiltered = state.filterTag === 'all' ? state.contacts : state.contacts.filter(c => c.tag === state.filterTag);
    const searchQuery = (state.contactSearch || '').trim().toLowerCase();
    const filteredContacts = !searchQuery ? tagFiltered : tagFiltered.filter(c => {
      const name = ((c.firstName||'') + ' ' + (c.lastName||'')).toLowerCase();
      const phoneDigits = String(c.phone || '').replace(/\D/g, '');
      const queryDigits = searchQuery.replace(/\D/g, '');
      const email = (c.email || '').toLowerCase();
      const notes = (c.notes || '').toLowerCase();
      return name.includes(searchQuery) || (queryDigits && phoneDigits.includes(queryDigits)) || email.includes(searchQuery) || notes.includes(searchQuery);
    });
    const sortedContacts = filteredContacts.slice().sort((a,b) => (a.firstName+a.lastName).localeCompare(b.firstName+b.lastName));

    let html = '<div class="crm-tabs">';
    ['today','pipeline','contacts','calendar','links','history'].forEach(t => {
      const label = t === 'today' ? 'Today' : t === 'pipeline' ? 'Active Pipeline' : t === 'contacts' ? 'Contacts' : t === 'calendar' ? 'Calendar' : t === 'links' ? 'Links' : 'History';
      html += '<button class="crm-tab' + (state.tab===t?' active':'') + '" data-tab="' + t + '">' + label + '</button>';
    });
    html += '</div><div class="crm-body">';

    if (!isStandalone()) {
      html += '<div class="crm-banner"><span>Add this to your homescreen for daily reminders.</span></div>';
    } else if (state.notifStatus !== 'enabled') {
      html += '<div class="crm-banner"><span>Turn on daily notifications for callbacks.</span><button class="crm-btn crm-btn-primary" id="enable-notif-btn">Enable</button></div>';
    }

    if (state.tab === 'today') {
      html += '<div class="crm-section-title">Callbacks</div>';
      if (dueToday.length === 0) html += '<div class="crm-empty">Nothing due today.</div>';
      dueToday.forEach(c => {
        html += '<div class="crm-card"><div class="crm-row"><div>' +
          '<div class="crm-name">' + esc(c.firstName) + ' ' + esc(c.lastName) + (c.callbackTime ? ' <span class="crm-method">' + esc(formatTime(c.callbackTime)) + '</span>' : '') + '</div>' +
          '<div class="crm-sub">' + badge(c.tag) + '<span class="crm-method">' + esc(METHOD_LABELS[c.method]) + ' &middot; ' + esc(formatPhoneDisplay(c.phone)) + '</span></div>' +
          (c.notes ? '<div class="crm-sub">' + esc(c.notes) + '</div>' : '') +
          '</div><button class="crm-btn crm-btn-primary" data-done="' + c.id + '">Done</button></div></div>';
      });
      html += '<div class="crm-section-title">To-dos</div>';
      html += '<div class="crm-taskrow"><input type="text" id="new-task-input" placeholder="Print flyers" value="' + esc(state.newTaskDraft || '') + '"/>' +
        '<input type="date" id="new-task-date" value="' + (state.newTaskDate || todayStr()) + '"/>' +
        '<input type="time" id="new-task-time" value="' + (state.newTaskTime || '') + '"/>' +
        '<button class="crm-btn" id="add-task-btn">Add</button></div>';
      taskDueToday.forEach(t => {
        html += '<div class="crm-card"><div class="crm-row">' +
          '<label class="crm-checkbox-row"><input type="checkbox" data-toggle-task="' + t.id + '"/><span>' + esc(t.text) + (t.time ? ' <span class="crm-method">' + esc(formatTime(t.time)) + '</span>' : '') + (t.date ? ' <span class="crm-method">(' + esc(formatDate(t.date)) + ')</span>' : '') + '</span></label>' +
          '<div style="display:flex;gap:6px"><button class="crm-btn" data-edit-task="' + t.id + '">Edit</button><button class="crm-close" data-delete-task="' + t.id + '">&times;</button></div></div></div>';
      });
      if (doneTasks.length > 0) {
        html += '<div class="crm-section-title">Done</div>';
        doneTasks.forEach(t => {
          html += '<div class="crm-card" style="opacity:0.55"><div class="crm-row">' +
            '<label class="crm-checkbox-row"><input type="checkbox" checked data-toggle-task="' + t.id + '"/><span style="text-decoration:line-through">' + esc(t.text) + '</span></label>' +
            '<div style="display:flex;gap:6px"><button class="crm-btn" data-edit-task="' + t.id + '">Edit</button><button class="crm-close" data-delete-task="' + t.id + '">&times;</button></div></div></div>';
        });
      }
    }

    if (state.tab === 'pipeline') {
      html += '<div class="crm-actions" style="margin-bottom:1rem"><button class="crm-btn crm-btn-primary" id="open-add-pipeline" style="flex:1">+ Add to pipeline</button></div>';
      if (state.pipeline.length === 0) html += '<div class="crm-empty">No active files yet. Add your first one above.</div>';
      html += '<div id="pipeline-list">';
      state.pipeline.forEach((p, i) => {
        const lt = loanTypeLabel(p);
        html += '<div class="crm-card" data-pipeline-id="' + p.id + '"><div class="crm-row">' +
          '<span class="drag-handle" data-drag-handle="' + p.id + '">&#9776;</span>' +
          '<div style="flex:1">' +
          '<div class="crm-name">#' + (i+1) + ' ' + esc(p.name) + '</div>' +
          '<div class="crm-sub">' + statusBadge(p.status) + (lt ? ' <span class="crm-method">' + esc(lt) + '</span>' : '') + '</div>' +
          (p.nextStep ? '<div class="crm-sub">Next step: ' + esc(p.nextStep) + '</div>' : '') +
          '</div><button class="crm-btn" data-edit-pipeline="' + p.id + '">Edit</button></div></div>';
      });
      html += '</div>';
    }

    if (state.tab === 'contacts') {
      html += '<div class="crm-actions" style="margin-bottom:1rem">' +
        '<button class="crm-btn crm-btn-primary" id="open-add-contact" style="flex:2">+ Add contact</button>' +
        '<button class="crm-btn" id="export-contacts-btn" style="flex:1">Export to Excel</button>' +
        '</div>';
      html += '<div class="crm-field"><input type="text" id="contact-search" placeholder="Search name, phone, email, notes..." value="' + esc(state.contactSearch || '') + '"/></div>';
      html += '<div class="crm-filters">';
      ['all','realtor','client','other'].forEach(tg => {
        const active = state.filterTag === tg;
        html += '<button class="crm-btn" data-filter="' + tg + '" style="' + (active ? 'background:#1a5fb4;color:#fff;border-color:#1a5fb4' : '') + '">' + (tg === 'all' ? 'All' : TAG_LABELS[tg]) + '</button>';
      });
      html += '</div>';
      if (sortedContacts.length === 0) html += '<div class="crm-empty">No contacts yet. Add your first one above.</div>';
      sortedContacts.forEach(c => {
        html += '<div class="crm-card"><div class="crm-row"><div>' +
          '<div class="crm-name">' + esc(c.firstName) + ' ' + esc(c.lastName) + '</div>' +
          '<div class="crm-sub">' + badge(c.tag) + '<span class="crm-method">' + esc(METHOD_LABELS[c.method]) + ' &middot; ' + esc(formatPhoneDisplay(c.phone)) + '</span></div>' +
          '<div class="crm-sub">Next callback: ' + esc(formatDate(c.callbackDate)) + (c.callbackTime ? ' at ' + esc(formatTime(c.callbackTime)) : '') + '</div>' +
          (c.email ? '<div class="crm-sub">' + esc(c.email) + '</div>' : '') +
          ((c.tag === 'client' || c.tag === 'realtor') && c.source ? '<div class="crm-sub">Source: ' + esc(c.source) + '</div>' : '') +
          (c.notes ? '<div class="crm-sub">' + esc(c.notes) + '</div>' : '') +
          '</div><button class="crm-btn" data-edit-contact="' + c.id + '">Edit</button></div></div>';
      });
    }

    if (state.tab === 'calendar') {
      html += renderCalendar();
    }

    if (state.tab === 'links') {
      const lnd = state.linkDraft || {};
      html += '<div class="crm-card">' +
        field('Name', 'text', 'lf-name', esc(lnd.name || ''), 'Pricing engine') +
        field('Link', 'url', 'lf-url', esc(lnd.url || ''), 'https://...') +
        '<button class="crm-btn crm-btn-primary" id="add-link-btn" style="width:100%">Add link</button>' +
        '</div>';
      if (state.links.length === 0) html += '<div class="crm-empty">No links saved yet.</div>';
      state.links.forEach((l, i) => {
        if (state.editingLinkId === l.id) {
          const ed = state.editLinkDraft || { name: l.name, url: l.url };
          html += '<div class="crm-card" data-link-id="' + l.id + '">' +
            field('Name', 'text', 'el-name', esc(ed.name || ''), 'Pricing engine') +
            field('Link', 'url', 'el-url', esc(ed.url || ''), 'https://...') +
            '<div class="crm-actions"><button class="crm-btn" data-cancel-link="1">Cancel</button><button class="crm-btn crm-btn-primary" data-save-link="' + l.id + '">Save</button></div>' +
            '</div>';
        } else {
          html += '<div class="crm-card" data-link-id="' + l.id + '"><div class="crm-row">' +
            '<div style="flex:1"><div class="crm-name">#' + (i+1) + ' ' + esc(l.name) + '</div>' +
            '<div class="crm-sub" style="word-break:break-all"><a href="' + esc(l.url) + '" target="_blank" rel="noopener" style="color:#1a5fb4">' + esc(l.url) + '</a></div></div>' +
            '<div style="display:flex;gap:6px"><button class="crm-btn" data-edit-link="' + l.id + '">Edit</button><button class="crm-close" data-delete-link="' + l.id + '">&times;</button></div>' +
            '</div></div>';
        }
      });
    }

    if (state.tab === 'history') {
      if (state.history.length === 0) html += '<div class="crm-empty">No completed callbacks yet.</div>';
      state.history.forEach(h => {
        html += '<div class="crm-card">' +
          '<div class="crm-name">' + esc(h.firstName) + ' ' + esc(h.lastName) + '</div>' +

  function renderCalendar() {
    const y = state.calYear, m = state.calMonth;
    const first = new Date(y, m, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const today = todayStr();

    const dueByDate = {};
    state.contacts.forEach(c => { if (c.callbackDate) { (dueByDate[c.callbackDate] = dueByDate[c.callbackDate] || []).push({ type: 'contact', item: c }); } });
    state.tasks.forEach(t => { if (!t.done && t.date) { (dueByDate[t.date] = dueByDate[t.date] || []).push({ type: 'task', item: t }); } });

    let html = '<div class="cal-nav"><button class="crm-btn" data-cal-prev="1">&larr;</button><h3>' + MONTH_NAMES[m] + ' ' + y + '</h3><button class="crm-btn" data-cal-next="1">&rarr;</button></div>';
    html += '<div class="cal-grid">';
    DOW.forEach(d => html += '<div class="cal-dow">' + d + '</div>');
    for (let i = 0; i < startDow; i++) html += '<div class="cal-day empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(y, m, d);
      const has = dueByDate[key] && dueByDate[key].length > 0;
      let cls = 'cal-day';
      if (key === today) cls += ' today';
      if (key === state.calSelected) cls += ' selected';
      html += '<div class="' + cls + '" data-cal-day="' + key + '">' + d + (has ? '<div class="cal-dot"></div>' : '') + '</div>';
    }
    html += '</div>';

    if (state.calSelected) {
      const items = dueByDate[state.calSelected] || [];
      html += '<div class="crm-section-title">' + formatDate(state.calSelected) + '</div>';
      html += '<div class="crm-taskrow"><input type="text" id="cal-new-task-input" placeholder="Add a to-do for this day" value="' + esc(state.calNewTaskDraft || '') + '"/>' +

        '<button class="crm-btn" id="cal-add-task-btn">Add</button></div>';

      items.forEach(entry => {
        if (entry.type === 'contact') {

          html += '<div class="crm-card"><div class="crm-row"><div>' +
            '<div class="crm-name">' + esc(c.firstName) + ' ' + esc(c.lastName) + (c.callbackTime ? ' <span class="crm-method">' + esc(formatTime(c.callbackTime)) + '</span>' : '') + '</div>' +

        } else {

          html += '<div class="crm-card"><div class="crm-row"><div class="crm-name">' + esc(t.text) + (t.time ? ' <span class="crm-method">' + esc(formatTime(t.time)) + '</span>' : '') + '</div>' +

        }
      });
    }

  function exportContactsCSV() {
    const headers = ['First Name','Last Name','Tag','Phone','Email','Contact Method','Next Callback Date','Next Callback Time','Source','Notes'];
    const rows = state.contacts.map(c => [
      c.firstName || '', c.lastName || '', TAG_LABELS[c.tag] || c.tag || '',
      formatPhoneDisplay(c.phone), c.email || '', METHOD_LABELS[c.method] || c.method || '',
      c.callbackDate || '', c.callbackTime || '', c.source || '', c.notes || ''
    ]);
    const csvEscape = v => '"' + String(v).replace(/"/g, '""') + '"';
    const csv = [headers, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'contacts-' + todayStr() + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function wirePipelineDrag() {
    const list = document.getElementById('pipeline-list');
    if (!list) return;
    list.querySelectorAll('[data-drag-handle]').forEach(handle => {
      handle.addEventListener('pointerdown', (e) => {
        const card = handle.closest('.crm-card');
        if (!card) return;
        e.preventDefault();
        card.classList.add('dragging');
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}

        const onMove = (ev) => {
          const el = document.elementFromPoint(ev.clientX, ev.clientY);
          const target = el && el.closest('.crm-card');
          if (target && target !== card && list.contains(target)) {
            const rect = target.getBoundingClientRect();
            const before = (ev.clientY - rect.top) < rect.height / 2;
            list.insertBefore(card, before ? target : target.nextSibling);
          }
        };
        const onUp = async (ev) => {
          card.classList.remove('dragging');
          try { handle.releasePointerCapture(ev.pointerId); } catch (err) {}
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          document.removeEventListener('pointercancel', onUp);
          const newOrder = Array.from(list.querySelectorAll('[data-pipeline-id]')).map(c => c.getAttribute('data-pipeline-id'));
          state.pipeline = newOrder.map(id => state.pipeline.find(p => p.id === id)).filter(Boolean);
          await saveAll();
          render();
        };
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
      });
    });
  }

      render();
    };
    const deleteEditPipeline = document.getElementById('delete-edit-pipeline');
    if (deleteEditPipeline) deleteEditPipeline.onclick = async () => {
      if (!confirm('Remove this file from the pipeline?')) return;
      const id = state.editPipelineTarget.id;
      state.pipeline = state.pipeline.filter(p => p.id !== id);
      await saveAll();
      state.modal = null; state.editPipelineTarget = null; state.editPipelineDraft = null;
      render();
    };

    wirePipelineDrag();

    document.querySelectorAll('[data-edit-contact]').forEach(el => el.onclick = () => {
      const id = el.getAttribute('data-edit-contact');
      state.editContactTarget = state.contacts.find(c => c.id === id);
      state.editContactDraft = null;
      state.modal = 'edit-contact';
      render();
    });
    const closeEditContact = document.getElementById('close-edit-contact');
    if (closeEditContact) closeEditContact.onclick = () => { state.modal = null; state.editContactTarget = null; render(); };
    const ecTag = document.getElementById('ec-tag');
    if (ecTag) ecTag.onchange = () => { readEditContactDraft(); render(); };
    const saveEditContact = document.getElementById('save-edit-contact');
    if (saveEditContact) saveEditContact.onclick = async () => {
      readEditContactDraft();
      const d = state.editContactDraft;
      if (!d.firstName.trim() || !d.phone.trim() || !d.callbackDate) return;
      const id = state.editContactTarget.id;
      state.contacts = state.contacts.map(c => c.id === id
        ? { ...c, firstName: d.firstName.trim(), lastName: d.lastName.trim(), tag: d.tag, phone: d.phone.trim(), email: (d.email || '').trim(), method: d.method, callbackDate: d.callbackDate, callbackTime: d.callbackTime || '', source: (d.tag === 'client' || d.tag === 'realtor') ? (d.source || '').trim() : '', notes: (d.notes || '').trim() }
        : c
      );
      await saveAll();
      state.modal = null; state.editContactTarget = null; state.editContactDraft = null;
      render();
    };
    const deleteEditContact = document.getElementById('delete-edit-contact');
    if (deleteEditContact) deleteEditContact.onclick = async () => {
      if (!confirm('Delete this contact? This cannot be undone.')) return;
      const id = state.editContactTarget.id;
      state.contacts = state.contacts.filter(c => c.id !== id);
      await saveAll();
      state.modal = null; state.editContactTarget = null; state.editContactDraft = null;
      render();
    };

    document.querySelectorAll('[data-done]').forEach(el => el.onclick = () => {
      const id = el.getAttribute('data-done');
      state.doneTarget = state.contacts.find(c => c.id === id);
      state.doneDraft = null;
      state.modal = 'done';
      render();
    });
    const closeDone = document.getElementById('close-done');
    if (closeDone) closeDone.onclick = () => { state.modal = null; render(); };
    const cancelDone = document.getElementById('cancel-done');
    if (cancelDone) cancelDone.onclick = () => { state.modal = null; render(); };
    const confirmDone = document.getElementById('confirm-done');
    if (confirmDone) confirmDone.onclick = async () => {
      readDoneDraft();
      const d = state.doneDraft;
      const c = state.doneTarget;
      if (!d.firstName.trim() || !d.phone.trim() || !d.nextDate) return;
      state.contacts = state.contacts.map(x => x.id === c.id
        ? { ...x, firstName: d.firstName.trim(), lastName: d.lastName.trim(), tag: d.tag, phone: d.phone.trim(), method: d.nextMethod, callbackDate: d.nextDate, callbackTime: d.nextTime || '' }
        : x
      );
      state.history.unshift({ id: uid(), contactId: c.id, firstName: d.firstName.trim(), lastName: d.lastName.trim(), tag: d.tag, phone: d.phone.trim(), method: c.method, completedDate: todayStr(), nextDate: d.nextDate });
      await saveAll();
      state.modal = null; state.doneTarget = null;
      render();
    };

    const taskInput = document.getElementById('new-task-input');
    if (taskInput) taskInput.oninput = () => { state.newTaskDraft = taskInput.value; };
    const taskDateInput = document.getElementById('new-task-date');
    if (taskDateInput) taskDateInput.oninput = () => { state.newTaskDate = taskDateInput.value; };
    const taskTimeInput = document.getElementById('new-task-time');
    if (taskTimeInput) taskTimeInput.oninput = () => { state.newTaskTime = taskTimeInput.value; };
    const addTaskBtn = document.getElementById('add-task-btn');
    if (addTaskBtn) addTaskBtn.onclick = async () => {
      const val = (state.newTaskDraft || '').trim();
      if (!val) return;
      state.tasks.push({ id: uid(), text: val, done: false, date: state.newTaskDate || todayStr(), time: state.newTaskTime || '' });
      state.newTaskDraft = '';
      await saveAll();
      render();
    };
    const lfName = document.getElementById('lf-name');
    if (lfName) lfName.oninput = () => { state.linkDraft = { name: lfName.value, url: (state.linkDraft && state.linkDraft.url) || (document.getElementById('lf-url') ? document.getElementById('lf-url').value : '') }; };
    const lfUrl = document.getElementById('lf-url');
    if (lfUrl) lfUrl.oninput = () => { state.linkDraft = { name: (state.linkDraft && state.linkDraft.name) || (document.getElementById('lf-name') ? document.getElementById('lf-name').value : ''), url: lfUrl.value }; };
    const addLinkBtn = document.getElementById('add-link-btn');
    if (addLinkBtn) addLinkBtn.onclick = async () => {
      const name = (document.getElementById('lf-name').value || '').trim();
      const url = (document.getElementById('lf-url').value || '').trim();
      if (!name || !url) return;
      state.links.push({ id: uid(), name: name, url: url });
      state.linkDraft = null;
      await saveAll();
      render();
    };
    document.querySelectorAll('[data-edit-link]').forEach(el => el.onclick = () => {
      state.editingLinkId = el.getAttribute('data-edit-link');
      state.editLinkDraft = null;
      render();
    });
    document.querySelectorAll('[data-cancel-link]').forEach(el => el.onclick = () => {
      state.editingLinkId = null;
      state.editLinkDraft = null;
      render();
    });
    const elName = document.getElementById('el-name');
    if (elName) elName.oninput = () => { state.editLinkDraft = { name: elName.value, url: (state.editLinkDraft && state.editLinkDraft.url) || (document.getElementById('el-url') ? document.getElementById('el-url').value : '') }; };
    const elUrl = document.getElementById('el-url');
    if (elUrl) elUrl.oninput = () => { state.editLinkDraft = { name: (state.editLinkDraft && state.editLinkDraft.name) || (document.getElementById('el-name') ? document.getElementById('el-name').value : ''), url: elUrl.value }; };
    document.querySelectorAll('[data-save-link]').forEach(el => el.onclick = async () => {
      const id = el.getAttribute('data-save-link');
      const name = (document.getElementById('el-name').value || '').trim();
      const url = (document.getElementById('el-url').value || '').trim();
      if (!name || !url) return;
      state.links = state.links.map(l => l.id === id ? { ...l, name: name, url: url } : l);
      state.editingLinkId = null;
      state.editLinkDraft = null;
      await saveAll();
      render();
    });
    document.querySelectorAll('[data-delete-link]').forEach(el => el.onclick = async () => {
      const id = el.getAttribute('data-delete-link');
      state.links = state.links.filter(l => l.id !== id);
      await saveAll();
      render();
    });

    document.querySelectorAll('[data-toggle-task]').forEach(el => el.onclick = async () => {
      const id = el.getAttribute('data-toggle-task');
      state.tasks = state.tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      await saveAll();
      render();
    });
    document.querySelectorAll('[data-delete-task]').forEach(el => el.onclick = async () => {
      const id = el.getAttribute('data-delete-task');
      state.tasks = state.tasks.filter(t => t.id !== id);
      await saveAll();
      render();
    });

    document.querySelectorAll('[data-edit-task]').forEach(el => el.onclick = () => {
      const id = el.getAttribute('data-edit-task');
      state.editTaskTarget = state.tasks.find(t => t.id === id);
      state.editTaskDraft = null;
      state.modal = 'edit-task';
      render();
    });
    const closeEditTask = document.getElementById('close-edit-task');
    if (closeEditTask) closeEditTask.onclick = () => { state.modal = null; state.editTaskTarget = null; render(); };
    const saveEditTask = document.getElementById('save-edit-task');
    if (saveEditTask) saveEditTask.onclick = async () => {
      const text = document.getElementById('et-text').value.trim();
      const date = document.getElementById('et-date').value;
      const time = document.getElementById('et-time').value;
      if (!text || !date) return;
      const id = state.editTaskTarget.id;
      state.tasks = state.tasks.map(t => t.id === id ? { ...t, text, date, time } : t);
      await saveAll();
      state.modal = null; state.editTaskTarget = null;
      render();
    };
    const deleteEditTask = document.getElementById('delete-edit-task');
    if (deleteEditTask) deleteEditTask.onclick = async () => {
      const id = state.editTaskTarget.id;
      state.tasks = state.tasks.filter(t => t.id !== id);
      await saveAll();
      state.modal = null; state.editTaskTarget = null;
      render();
    };

    const prevBtn = document.querySelector('[data-cal-prev]');
    if (prevBtn) prevBtn.onclick = () => {
      state.calMonth -= 1;
      if (state.calMonth < 0) { state.calMonth = 11; state.calYear -= 1; }
      render();
    };
    const nextBtn = document.querySelector('[data-cal-next]');
    if (nextBtn) nextBtn.onclick = () => {
      state.calMonth += 1;
      if (state.calMonth > 11) { state.calMonth = 0; state.calYear += 1; }
      render();
    };
    document.querySelectorAll('[data-cal-day]').forEach(el => el.onclick = () => {
      const key = el.getAttribute('data-cal-day');
      state.calSelected = state.calSelected === key ? null : key;
      state.calNewTaskDraft = '';
      state.calNewTaskTime = '';
      render();
    });

    const calTaskInput = document.getElementById('cal-new-task-input');
    if (calTaskInput) calTaskInput.oninput = () => { state.calNewTaskDraft = calTaskInput.value; };
    const calTaskTimeInput = document.getElementById('cal-new-task-time');
    if (calTaskTimeInput) calTaskTimeInput.oninput = () => { state.calNewTaskTime = calTaskTimeInput.value; };
    const calAddTaskBtn = document.getElementById('cal-add-task-btn');
    if (calAddTaskBtn) calAddTaskBtn.onclick = async () => {
      const val = (state.calNewTaskDraft || '').trim();
      if (!val) return;
      state.tasks.push({ id: uid(), text: val, done: false, date: state.calSelected, time: state.calNewTaskTime || '' });
      state.calNewTaskDraft = '';
      state.calNewTaskTime = '';
      await saveAll();
      render();
    };
  }

  async function init() {
    if ('serviceWorker' in navigator) {
      try { await navigator.serviceWorker.register('/service-worker.js'); } catch (e) { console.error(e); }
    }
    await loadAll();
    await setupPush();
    render();
  }

  init();
})();
</script>
</body>
</html>
